<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChyguiSlide Display</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles/display.css" />
    <script type="module" src="/src/display/main.ts"></script>

    <!-- Главный контейнер кадра: в нём лежат все слои вывода. Проявление и

      <div id="layer-bg" class="layer"></div>
      <div id="layer-overlay" class="layer"></div>

    </div>
