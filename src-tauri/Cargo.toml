[package]
name = "chyguislide"
version = "0.1.4"
description = "Church presentation controller and display"
authors = ["you"]
edition = "2021"

[lib]
name = "chyguislide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
# Автообновление: чтение описания релиза с GitVerse, скачивание и проверка архива.
reqwest = { version = "0.12", features = ["blocking"] }
sha2 = "0.10"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Импорт текста песен со сторонних сайтов: разбор HTML (`scraper`) и определение
# кодировки страницы (`encoding_rs` уже есть в дереве как зависимость `reqwest`,
# отдельной сборки не требует — нужен для сайтов с `windows-1251`).
scraper = "0.26"
encoding_rs = "0.8"
# Разбор адреса страницы: `url` уже есть в дереве как зависимость Tauri, поэтому
# отдельной сборки не требует.
url = "2"

[target.'cfg(windows)'.dependencies]
# Win32_System_Registry нужен для `ShellExecuteExW`: структура
# `SHELLEXECUTEINFOW` объявлена в windows-sys только с этим набором.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
